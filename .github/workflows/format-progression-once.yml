name: Normalize progression navigation once
on:
  push:
    branches: [curriculum/reader-phase-navigation-and-coverage-20261029]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/pages/CourseLessonPage.tsx src/pages/courseCatalog.css src/content/course-full-progression.test.ts
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CourseLessonPage.tsx src/pages/courseCatalog.css src/content/course-full-progression.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(curriculum): format phased navigation and coverage test"
            git push
          fi
