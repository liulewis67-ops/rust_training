name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Course sample tests compile local Rust examples, even though the site runs in the browser.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint and React hooks
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Regression tests
        run: pnpm test
      - name: Course sample validation
        run: pnpm content:check-samples
      - name: Published course manifest validation
        run: pnpm content:validate-public
      - name: Production build
        run: pnpm build
