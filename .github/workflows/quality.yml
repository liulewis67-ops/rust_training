name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      MUTATION_REPORT_DIR: artifacts/mutation-report
    steps:
      - uses: actions/checkout@v4
      # Course sample tests compile local Rust examples, even though the site runs in the browser.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint and React hooks
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Regression tests
        run: pnpm test
      - name: Course sample validation
        run: pnpm content:check-samples
      - name: Verified Rust lesson drills and expected compiler errors
        run: node scripts/verify-lesson-drills.mjs
      - name: Compile published bilingual Markdown Rust code fences
        run: node scripts/verify-markdown-rust-fences.mjs
      - name: Audit remaining 33 bilingual lesson fences and contextual snippets
        run: python3 scripts/verify-remaining-markdown-fences.py
      - name: Released ZIP integrity and staged clean-room repair
        run: python3 scripts/verify-starter-zips.py
      - name: Contract mutation sensitivity (9 modules)
        run: python3 scripts/verify-lesson-mutations.py
      - name: Original ZIP public-test blind checks
        run: python3 scripts/verify-original-zip-blind-tests.py
      - name: Original M07 parser adversarial ZIP acceptance
        run: python3 scripts/verify-m07-parser-adversarial.py
      - name: M08 local lab behavior contracts
        run: node scripts/verify-m08-labs.mjs
      - name: M09 error modeling lab contracts
        run: node scripts/verify-m09-labs.mjs
      - name: M08 and M09 adversarial implementation mutations
        run: python3 scripts/verify-m08-m09-adversarial-mutations.py
      - name: Selected mutation sensitivity report
        run: python3 scripts/report-adversarial-mutation-score.py
      - name: Upload adversarial mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-m09-mutation-evidence
          path: artifacts/mutation-report/
          if-no-files-found: warn
      - name: Published course manifest validation
        run: pnpm content:validate-public
      - name: Production build
        run: pnpm build
