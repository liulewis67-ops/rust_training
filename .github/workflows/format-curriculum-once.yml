name: Normalize curriculum v2 formatting once
on:
  push:
    branches: [curriculum/coherent-learning-spine-20261029]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            src/data/learningContinuity.ts \
            src/content/course-continuity.test.ts \
            src/pages/CourseLessonPage.tsx \
            src/pages/courseCatalog.css \
            src/features/reading/lessonStructure.ts \
            content/course-continuity.json
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/learningContinuity.ts src/content/course-continuity.test.ts src/pages/CourseLessonPage.tsx src/pages/courseCatalog.css src/features/reading/lessonStructure.ts content/course-continuity.json
          if ! git diff --cached --quiet; then
            git commit -m "style(curriculum): apply repository formatting"
            git push
          fi
