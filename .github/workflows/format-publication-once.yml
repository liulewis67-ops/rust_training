name: Temporary formatting
on:
  push:
    branches: [fix/publication-contract-tests-20261028]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format currently modified source and tests
        run: |
          pnpm exec prettier --write \
            scripts/course-content.mjs \
            schemas/course-pack.schema.json \
            src/data/courseCatalog.test.ts \
            src/data/courseCatalog.language.test.ts \
            src/features/search/searchIndex.test.ts \
            src/features/search/searchIndex.language.test.ts \
            src/pages/CourseLessonPage.test.tsx \
            src/app/router.test.ts \
            src/app/App.test.tsx
      - name: Commit Prettier-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/course-content.mjs schemas/course-pack.schema.json src/data/courseCatalog.test.ts src/data/courseCatalog.language.test.ts src/features/search/searchIndex.test.ts src/features/search/searchIndex.language.test.ts src/pages/CourseLessonPage.test.tsx src/app/router.test.ts src/app/App.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize release validation and tests"
            git push
          fi
