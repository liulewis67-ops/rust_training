[package]
name = "rust-path-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "=0.8.9"
argon2 = "=0.5.3"
dotenvy = "=0.15.7"
async-trait = "=0.1.92"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
openidconnect = "=4.0.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
time = "=0.3.44"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-sessions = "=0.15.0"
jiff = "=0.2.38"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
chrono = "=0.4.45"
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
