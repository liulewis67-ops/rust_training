[package]
name = "rust-path-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "=0.8.9"
dotenvy = "=0.15.7"
openidconnect = "=4.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
time = "=0.3.44"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread"] }
tower-sessions = "=0.15.0"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
