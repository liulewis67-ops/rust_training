[package]
name = "rust-path-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
axum = "=0.8.9"
dotenvy = "=0.15.7"
async-trait = "=0.1.92"
openidconnect = "=4.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "time"] }
time = "=0.3.44"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-sessions = "=0.15.0"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
